services:
  postgres:
    image: postgres:15
    container_name: local_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: demo_db
    ports:
      - "55432:5432"  # наружу пробрасываем 55432
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./01_create_schema.sql:/docker-entrypoint-initdb.d/01_create_schema.sql:ro
      - ./02_generate_data.sql:/docker-entrypoint-initdb.d/02_generate_data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d demo_db"]
      interval: 5s
      retries: 20
    networks:
      - de-lab

volumes:
  pg_data:

networks:
  de-lab:
    external: true