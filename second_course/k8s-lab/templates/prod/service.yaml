# ============================================================
# Шаблон к заданию 4. Service — «Стабильный доступ»
# ------------------------------------------------------------
# Напоминание из лекции: поды эфемерны, их IP меняются при
# каждом пересоздании. Service даёт стабильный адрес и DNS-имя
# и сам находит живые поды по labels.
#
# Условие: задание 3 выполнено, deployment работает (3/3).
# ============================================================

apiVersion: v1
kind: Service

metadata:
  name: calc-app         # договоримся: calc-app
  namespace: production       # тот же, что у deployment

spec:
  # Какой тип даёт доступ с ХОСТ-МАШИНЫ (снаружи кластера)?
  # Варианты: ClusterIP / NodePort / LoadBalancer.
  # Вспомните таблицу из лекции.
  type: NodePort

  selector:
    # СЕРДЦЕ этого файла. Сервис найдёт поды по этой бирке.
    # Загляните в templates/deployment.yaml: какой label у подов?
    app: calc-app  

  ports:
    # Три порта — не перепутайте:
    #   port       — на каком порту отвечает сам сервис внутри кластера
    #   targetPort — на какой порт подов он пересылает (см. задание 2!)
    #   nodePort   — порт на ноде для доступа снаружи (30000-32767)
    - port: 80
      targetPort: 5000
      nodePort: 30081

# ------------------------------------------------------------
# После заполнения:
#   kubectl apply -f service.yaml
#   kubectl describe service calc-app -n demo
# В секции Endpoints должны быть IP всех трёх подов.
# Если Endpoints пуст — selector не совпал с labels подов!
# ------------------------------------------------------------
